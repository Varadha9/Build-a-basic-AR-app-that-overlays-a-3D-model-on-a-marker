<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ex:6 - AR 3D Model Overlay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { overflow: hidden; background: #000; color: #fff; width: 100vw; height: 100vh; touch-action: manipulation; }

        #video-feed {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
        }
        #three-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: auto;
        }

        /* Academic Top HUD */
        .hud-header {
            position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px);
            padding: 10px 18px; border-radius: 20px; z-index: 999;
            width: 92%; max-width: 480px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6); border: 1px solid rgba(56, 189, 248, 0.4);
        }
        .hud-top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .hud-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(30, 41, 59, 0.8); padding: 3px 10px; border-radius: 12px;
            font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
        }
        .status-dot {
            width: 9px; height: 9px; border-radius: 50%; background: #f59e0b;
            box-shadow: 0 0 10px #f59e0b; animation: pulse 1s infinite;
        }
        .status-dot.locked { background: #10b981; box-shadow: 0 0 12px #10b981; animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .header-title { font-size: 12px; font-weight: 800; color: #f8fafc; }
        .header-subtitle { font-size: 10px; color: #38bdf8; font-weight: 500; }
        .tracking-info {
            display: flex; justify-content: space-between; font-size: 9px; color: #94a3b8;
            border-top: 1px solid rgba(255,255,255,0.1); padding-top: 4px; margin-top: 4px;
        }

        /* Viewfinder Reticle */
        .scanner-frame {
            position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%);
            width: min(72vw, 260px); height: min(72vw, 260px); z-index: 999; pointer-events: none;
            border: 2px dashed rgba(56, 189, 248, 0.7); border-radius: 24px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .scanner-frame.locked {
            border: 2.5px solid #10b981; box-shadow: 0 0 35px rgba(16, 185, 129, 0.6);
            background: rgba(16, 185, 129, 0.05);
        }
        .scanner-corners {
            position: absolute; width: 100%; height: 100%; pointer-events: none;
        }
        .laser-line {
            position: absolute; width: 90%; height: 2px; background: #38bdf8;
            box-shadow: 0 0 10px #38bdf8; top: 10px;
            animation: scanLaser 1.8s infinite alternate ease-in-out;
        }
        @keyframes scanLaser {
            0% { top: 12px; opacity: 0.9; }
            100% { top: calc(100% - 14px); opacity: 0.9; }
        }
        .scanner-label {
            position: absolute; bottom: -32px; font-size: 11px; font-weight: 700; color: #f1f5f9;
            background: rgba(15, 23, 42, 0.9); padding: 5px 14px; border-radius: 14px;
            white-space: nowrap; border: 1px solid rgba(255,255,255,0.15);
        }

        /* Bottom Control Panel */
        .bottom-panel {
            position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
            z-index: 999; display: flex; flex-direction: column; gap: 8px; width: 92%; max-width: 440px;
            align-items: center;
        }
        .instruction-banner {
            font-size: 10px; color: #cbd5e1; background: rgba(15, 23, 42, 0.85);
            padding: 4px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .btn-row { display: flex; gap: 8px; width: 100%; justify-content: center; }
        .btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: 1px solid #38bdf8; color: #fff;
            padding: 10px 16px; border-radius: 20px; font-size: 11.5px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; gap: 5px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); flex: 1; justify-content: center;
        }
        .btn:active { transform: scale(0.96); }
        .btn-green { background: linear-gradient(135deg, #059669, #047857); border-color: #34d399; }
        .btn-purple { background: linear-gradient(135deg, #7c3aed, #6d28d9); border-color: #a78bfa; }
        .btn-gray { background: linear-gradient(135deg, #334155, #1e293b); border-color: #64748b; }
    </style>
    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
</head>
<body>
    <video id="video-feed" playsinline autoplay muted></video>
    <canvas id="three-canvas"></canvas>

    <!-- Header HUD -->
    <div class="hud-header">
        <div class="hud-top-row">
            <div class="hud-badge">
                <div class="status-dot" id="status-dot"></div>
                <span id="badge-text">SEARCHING</span>
            </div>
            <div class="header-title">EX:6 AR 3D MODEL OVERLAY</div>
        </div>
        <div class="header-subtitle">Varad Mandhare (ADT23SOCB1574) | Immersive App Dev</div>
        <div class="tracking-info">
            <span id="target-name">Target: AR_Marker_Target</span>
            <span id="fps-display">60 FPS</span>
            <span id="model-name">Model: Cyber Drone MK-VI</span>
        </div>
    </div>

    <!-- Scanner Viewfinder -->
    <div class="scanner-frame" id="scanner-frame">
        <div class="laser-line" id="laser-line"></div>
        <div class="scanner-label" id="scanner-label">Point camera at AR Marker Target</div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-panel">
        <div class="instruction-banner">
            🖐 1 Finger: Rotate 360° | ✌ 2 Fingers: Scale | Double-Tap: Reset
        </div>
        <div class="btn-row">
            <button class="btn btn-green" id="btn-toggle-track">
                <span>🎯</span> <span id="toggle-track-text">Target Found (Lock)</span>
            </button>
            <button class="btn btn-purple" id="btn-switch-model">
                <span>🔄</span> Switch Model
            </button>
            <button class="btn btn-gray" id="btn-reset">
                <span>⏮</span> Reset
            </button>
        </div>
    </div>

    <script>
        // --- 1. Camera Video Initialization ---
        const video = document.getElementById('video-feed');
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                console.warn("Camera fallback:", err);
            }
        }
        startCamera();

        // --- 2. Three.js AR Scene Setup ---
        const canvas = document.getElementById('three-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 4.5);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const blueLight = new THREE.PointLight(0x00e5ff, 2.5, 8);
        blueLight.position.set(0, 0, 1.5);
        scene.add(blueLight);

        // --- 3. Construct 3D Models ---
        const modelContainer = new THREE.Group();
        scene.add(modelContainer);

        let isLocked = false;
        let currentModelIndex = 0; // 0: Drone, 1: Gem Trophy
        let droneGroup, gemGroup;

        // Model 1: Cyber Drone MK-VI
        function buildDroneModel() {
            const group = new THREE.Group();

            // Materials
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x1e293b,
                metalness: 0.85,
                roughness: 0.25
            });
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0x00f0ff,
                wireframe: false
            });
            const goldMat = new THREE.MeshStandardMaterial({
                color: 0xf59e0b,
                metalness: 0.9,
                roughness: 0.15
            });

            // Central Chassis
            const coreGeo = new THREE.SphereGeometry(0.55, 32, 32);
            const core = new THREE.Mesh(coreGeo, bodyMat);
            group.add(core);

            // Glowing Sensor Eye
            const eyeGeo = new THREE.SphereGeometry(0.22, 24, 24);
            const eye = new THREE.Mesh(eyeGeo, glowMat);
            eye.position.set(0, 0.1, 0.45);
            group.add(eye);

            // Yaw Gyro Ring
            const ringGeo = new THREE.TorusGeometry(0.85, 0.04, 16, 64);
            const yawRing = new THREE.Mesh(ringGeo, goldMat);
            yawRing.name = "yawRing";
            group.add(yawRing);

            // Pitch Gyro Ring
            const pitchRing = new THREE.Mesh(new THREE.TorusGeometry(0.72, 0.03, 16, 64), glowMat);
            pitchRing.rotation.x = Math.PI / 2;
            pitchRing.name = "pitchRing";
            group.add(pitchRing);

            // 4 Quad Rotor Pylons and spinning blades
            const rotorArms = [
                { x: 0.7, y: 0.25, z: 0.7, dir: 1 },
                { x: -0.7, y: 0.25, z: 0.7, dir: -1 },
                { x: 0.7, y: 0.25, z: -0.7, dir: -1 },
                { x: -0.7, y: 0.25, z: -0.7, dir: 1 }
            ];

            const rotors = [];
            rotorArms.forEach((pos, idx) => {
                const armGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.6, 12);
                const arm = new THREE.Mesh(armGeo, bodyMat);
                arm.position.set(pos.x * 0.6, pos.y, pos.z * 0.6);
                arm.rotation.z = pos.x > 0 ? -0.5 : 0.5;
                group.add(arm);

                // Rotor Cap
                const capGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.08, 16);
                const cap = new THREE.Mesh(capGeo, bodyMat);
                cap.position.set(pos.x, pos.y + 0.15, pos.z);
                group.add(cap);

                // Propeller Blade
                const bladeGeo = new THREE.BoxGeometry(0.75, 0.02, 0.08);
                const blade = new THREE.Mesh(bladeGeo, glowMat);
                blade.position.set(pos.x, pos.y + 0.2, pos.z);
                group.add(blade);
                rotors.push({ mesh: blade, speed: 25 * pos.dir });
            });
            group.userData.rotors = rotors;

            // Holographic Status Card Floating Above Model
            const canvasTag = document.createElement('canvas');
            canvasTag.width = 512; canvasTag.height = 128;
            const ctx = canvasTag.getContext('2d');
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.roundRect(10, 10, 492, 108, 20);
            ctx.fill();
            ctx.lineWidth = 4; ctx.strokeStyle = '#00f0ff';
            ctx.stroke();
            ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('TARGET LOCKED: CYBER-DRONE MK-VI', 256, 55);
            ctx.fillStyle = '#94a3b8'; ctx.font = '20px sans-serif';
            ctx.fillText('Vuforia Planar AR Anchor Active', 256, 92);

            const tagTex = new THREE.CanvasTexture(canvasTag);
            const tagMat = new THREE.MeshBasicMaterial({ map: tagTex, transparent: true, side: THREE.DoubleSide });
            const tagMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.4), tagMat);
            tagMesh.position.set(0, 1.25, 0);
            group.add(tagMesh);

            return group;
        }

        // Model 2: Holographic AR Gem Trophy
        function buildGemModel() {
            const group = new THREE.Group();

            const gemMat = new THREE.MeshStandardMaterial({
                color: 0xa855f7,
                metalness: 0.7,
                roughness: 0.1,
                wireframe: false
            });
            const wireMat = new THREE.MeshBasicMaterial({
                color: 0x38bdf8,
                wireframe: true
            });

            // Outer wireframe icosahedron
            const outerGeo = new THREE.IcosahedronGeometry(0.85, 0);
            const outer = new THREE.Mesh(outerGeo, wireMat);
            group.add(outer);

            // Inner solid ruby core
            const innerGeo = new THREE.OctahedronGeometry(0.5, 0);
            const inner = new THREE.Mesh(innerGeo, gemMat);
            group.add(inner);

            // Orbit Rings
            const ring1 = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.02, 16, 64), new THREE.MeshBasicMaterial({ color: 0x10b981 }));
            ring1.name = "gemRing1";
            group.add(ring1);

            const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.02, 16, 64), new THREE.MeshBasicMaterial({ color: 0xf43f5e }));
            ring2.rotation.x = Math.PI / 3;
            ring2.name = "gemRing2";
            group.add(ring2);

            return group;
        }

        droneGroup = buildDroneModel();
        gemGroup = buildGemModel();
        gemGroup.visible = false;

        modelContainer.add(droneGroup);
        modelContainer.add(gemGroup);
        modelContainer.scale.set(0.001, 0.001, 0.001); // Hidden initially until tracking

        // --- 4. Interactive Touch Controls ---
        let touchStartX = 0, touchStartY = 0;
        let lastPinchDist = 0;
        let isTouching = false;
        let lastTouchTime = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                isTouching = true;
                lastTouchTime = Date.now();
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastPinchDist = Math.hypot(dx, dy);
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isTouching) {
                const deltaX = e.touches[0].clientX - touchStartX;
                const deltaY = e.touches[0].clientY - touchStartY;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;

                modelContainer.rotation.y += deltaX * 0.01;
                modelContainer.rotation.x += deltaY * 0.01;
                lastTouchTime = Date.now();
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const currentDist = Math.hypot(dx, dy);
                const scaleDelta = (currentDist - lastPinchDist) * 0.005;
                lastPinchDist = currentDist;

                const curScale = modelContainer.scale.x;
                const newScale = Math.max(0.3, Math.min(2.5, curScale + scaleDelta));
                modelContainer.scale.set(newScale, newScale, newScale);
                lastTouchTime = Date.now();
            }
        });

        window.addEventListener('touchend', () => { isTouching = false; });

        // Double-tap reset
        let lastTap = 0;
        window.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTap < 300) {
                resetModelTransform();
            }
            lastTap = now;
        });

        function resetModelTransform() {
            modelContainer.rotation.set(0, 0, 0);
            if (isLocked) {
                modelContainer.scale.set(1, 1, 1);
            }
        }

        // --- 5. UI Controls & State Management ---
        const statusDot = document.getElementById('status-dot');
        const badgeText = document.getElementById('badge-text');
        const scannerFrame = document.getElementById('scanner-frame');
        const laserLine = document.getElementById('laser-line');
        const scannerLabel = document.getElementById('scanner-label');
        const toggleBtnText = document.getElementById('toggle-track-text');
        const btnToggleTrack = document.getElementById('btn-toggle-track');
        const btnSwitchModel = document.getElementById('btn-switch-model');
        const btnReset = document.getElementById('btn-reset');
        const modelNameDisplay = document.getElementById('model-name');

        function setTrackingState(locked) {
            isLocked = locked;
            if (isLocked) {
                statusDot.classList.add('locked');
                badgeText.textContent = "● MARKER TRACKED";
                scannerFrame.classList.add('locked');
                laserLine.style.display = 'none';
                scannerLabel.textContent = "AR Marker Locked: 3D Model Rendered";
                toggleBtnText.textContent = "Simulate Target Lost";
                btnToggleTrack.classList.remove('btn-green');
                btnToggleTrack.classList.add('btn-gray');

                // Pop-in bounce animation
                modelContainer.visible = true;
                modelContainer.scale.set(0.1, 0.1, 0.1);
                let t = 0;
                const anim = setInterval(() => {
                    t += 0.08;
                    const s = Math.min(1.0, t) + 0.2 * Math.sin(t * Math.PI) * (1.0 - Math.min(1.0, t));
                    modelContainer.scale.set(s, s, s);
                    if (t >= 1.0) {
                        modelContainer.scale.set(1, 1, 1);
                        clearInterval(anim);
                    }
                }, 16);
            } else {
                statusDot.classList.remove('locked');
                badgeText.textContent = "SEARCHING";
                scannerFrame.classList.remove('locked');
                laserLine.style.display = 'block';
                scannerLabel.textContent = "Point camera at AR Marker Target";
                toggleBtnText.textContent = "Target Found (Lock)";
                btnToggleTrack.classList.remove('btn-gray');
                btnToggleTrack.classList.add('btn-green');
                modelContainer.visible = false;
                modelContainer.scale.set(0.001, 0.001, 0.001);
            }
        }

        btnToggleTrack.addEventListener('click', () => {
            setTrackingState(!isLocked);
        });

        btnSwitchModel.addEventListener('click', () => {
            currentModelIndex = (currentModelIndex + 1) % 2;
            if (currentModelIndex === 0) {
                droneGroup.visible = true;
                gemGroup.visible = false;
                modelNameDisplay.textContent = "Model: Cyber Drone MK-VI";
            } else {
                droneGroup.visible = false;
                gemGroup.visible = true;
                modelNameDisplay.textContent = "Model: Holographic Gem Trophy";
            }
        });

        btnReset.addEventListener('click', resetModelTransform);

        // --- 6. Render & Animation Loop ---
        let lastFrameTime = performance.now();
        let frameCounter = 0;
        let fps = 60;
        const fpsDisplay = document.getElementById('fps-display');

        function animate(timestamp) {
            requestAnimationFrame(animate);

            // FPS Calculation
            frameCounter++;
            if (timestamp - lastFrameTime >= 500) {
                fps = Math.round((frameCounter * 1000) / (timestamp - lastFrameTime));
                fpsDisplay.textContent = `${fps} FPS`;
                frameCounter = 0;
                lastFrameTime = timestamp;
            }

            // Animate 3D Models
            if (isLocked) {
                // Drone animation
                if (droneGroup.visible) {
                    droneGroup.getObjectByName('yawRing').rotation.z += 0.03;
                    droneGroup.getObjectByName('pitchRing').rotation.y += 0.02;

                    droneGroup.userData.rotors.forEach(r => {
                        r.mesh.rotation.y += r.speed * 0.016;
                    });
                }

                // Gem animation
                if (gemGroup.visible) {
                    gemGroup.children[0].rotation.y += 0.02;
                    gemGroup.children[0].rotation.x += 0.01;
                    gemGroup.children[1].rotation.y -= 0.03;
                    gemGroup.getObjectByName('gemRing1').rotation.z += 0.025;
                    gemGroup.getObjectByName('gemRing2').rotation.x += 0.02;
                }

                // Smooth idle floating bob
                const now = Date.now();
                if (now - lastTouchTime > 1500) {
                    modelContainer.rotation.y += 0.008;
                    modelContainer.position.y = Math.sin(now * 0.003) * 0.12;
                }
            }

            renderer.render(scene, camera);
        }
        animate(performance.now());

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log("AR 3D Model Overlay Application Initialized Successfully.");
    </script>
</body>
</html>
